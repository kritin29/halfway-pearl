<!DOCTYPE html>
<!--
  Active theme is set on the <html> element below (ids in src/themes.ts,
  colors in src/themes.css).
-->
<html lang="en" data-theme="halfway">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f0e6" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fraunces (headings), Inter (body), IBM Plex Mono (airport codes, fares). -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap"
    />
    <title>Halfway</title>
    <!--
      First-paint background, mirroring --color-background in src/themes.css,
      so the frame before the CSS bundle arrives matches the theme.
    -->
    <style>
      html { background-color: #f5f0e6; color-scheme: light; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
